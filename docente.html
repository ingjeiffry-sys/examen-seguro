<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Examen Seguro · Panel docente</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="es.css?v=2">
<script src="config.js?v=2"></script>
<script src="es.js?v=2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  /* Acceso */
  .acceso { min-height: 100vh; display: grid; place-items: center; padding: 20px 16px; }
  .acceso .vidrio { width: min(440px, 100%); overflow: hidden; }
  .heroe { padding: 28px 26px 22px; color: #fff; background: var(--marca); position: relative; overflow: hidden; }
  .heroe::after { content: ''; position: absolute; width: 240px; height: 240px; right: -70px; top: -100px; border-radius: 50%; background: rgb(255 255 255 / .14); }
  .heroe h1 { color: #fff; } .heroe p { margin: 0; color: rgb(255 255 255 / .85); }
  .logo-b { width: 50px; height: 50px; border-radius: 16px; display: grid; place-items: center; background: rgb(255 255 255 / .2); margin-bottom: 16px; }
  .logo-b .ico { width: 26px; height: 26px; }
  /* Estructura */
  .app { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
  .lateral { position: sticky; top: 0; height: 100vh; padding: 18px 14px; display: flex; flex-direction: column; gap: 6px; border-right: 1px solid var(--linea);
    background: var(--sup); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }
  .marca-l { display: flex; gap: 10px; align-items: center; padding: 6px 8px 16px; }
  .marca-l .logo { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; background: var(--marca); color: #fff; }
  .marca-l b { display: block; } .marca-l span { font-size: 12px; color: var(--suave); }
  .nav { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 14px; border: 0; background: transparent; color: var(--suave); font-weight: 700; cursor: pointer; text-align: left; width: 100%; }
  .nav:hover { background: var(--sup2); color: var(--texto); }
  .nav.on { background: var(--sup-solida); color: var(--acento); box-shadow: var(--sombra); }
  .yo { margin-top: auto; padding: 12px; border-radius: 16px; background: var(--sup2); display: flex; gap: 10px; align-items: center; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--marca-2); color: #fff; font-weight: 800; flex: none; }
  .yo b { display: block; font-size: 14px; } .yo span { font-size: 12px; color: var(--suave); }
  .contenido { padding: 22px 26px 100px; min-width: 0; }
  .cabeza { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .cabeza .tit { flex: 1; min-width: 220px; }
  .cabeza h1 { font-size: 26px; }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .lateral { position: fixed; top: auto; bottom: 0; left: 0; right: 0; height: auto; z-index: 40; flex-direction: row; padding: 8px calc(8px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)); border-right: 0; border-top: 1px solid var(--linea); overflow-x: auto; }
    .marca-l, .yo, .lateral .solo-escritorio { display: none; }
    .nav { flex-direction: column; gap: 3px; font-size: 11px; padding: 7px 8px; min-width: 64px; align-items: center; }
    .contenido { padding: 16px 14px 110px; }
  }
  /* Indicadores */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .kpi { padding: 16px 18px; display: flex; gap: 12px; align-items: center; }
  .kpi b { display: block; font-size: 24px; letter-spacing: -.03em; line-height: 1.1; } .kpi span { font-size: 13px; color: var(--suave); }
  .rejilla { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .examen-t { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
  .examen-t .franja { height: 6px; background: var(--marca); } .examen-t.practica .franja { background: var(--marca-2); }
  .examen-t .cuerpo { padding: 16px 18px; flex: 1; }
  .examen-t h3 { margin: 8px 0 4px; font-size: 17px; }
  .metricas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 0; }
  .metricas div { padding: 9px 10px; border-radius: 12px; background: var(--sup2); }
  .metricas b { display: block; font-size: 17px; } .metricas span { font-size: 11.5px; color: var(--suave); }
  .acciones { display: flex; gap: 4px; padding: 10px 12px; border-top: 1px solid var(--linea); flex-wrap: wrap; }
  .filtros { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
  .filtros .entrada { width: auto; min-width: 150px; padding: 10px 14px; }
  .buscar { position: relative; flex: 1; min-width: 200px; } .buscar .ico { position: absolute; left: 13px; top: 12px; color: var(--tenue); } .buscar input { padding-left: 40px; width: 100%; }
  /* Editor */
  .pasos { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .paso { display: inline-flex; gap: 8px; align-items: center; padding: 10px 16px; border-radius: 999px; border: 1px solid var(--linea); background: var(--sup); font-weight: 700; color: var(--suave); cursor: pointer; }
  .paso.on { background: var(--texto); color: var(--fondo); border-color: var(--texto); }
  .paso .n { min-width: 22px; height: 22px; border-radius: 99px; display: grid; place-items: center; font-size: 12px; background: var(--sup2); padding: 0 6px; }
  .paso.on .n { background: rgb(255 255 255 / .2); }
  .preg-ed { padding: 16px 18px; margin-bottom: 12px; }
  .preg-ed .top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .preg-ed .num { min-width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; font-weight: 800; background: var(--marca); color: #fff; }
  .preg-ed .entrada.mini { width: auto; padding: 8px 12px; }
  .opcion { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
  .opcion .correcta { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--linea); background: var(--sup-fuerte); display: grid; place-items: center; cursor: pointer; color: transparent; flex: none; }
  .opcion .correcta.on { background: var(--verde); border-color: var(--verde); color: #fff; }
  .opcion .entrada { padding: 9px 12px; }
  .regla-ed { display: flex; gap: 14px; align-items: center; padding: 14px 16px; border-radius: 16px; background: var(--sup-fuerte); border: 1px solid var(--linea); margin-bottom: 10px; }
  .regla-ed .txt { flex: 1; } .regla-ed b { display: block; } .regla-ed span.d { font-size: 13.5px; color: var(--suave); }
  .contador { display: inline-flex; align-items: center; border-radius: 999px; border: 1px solid var(--linea); background: var(--sup-solida); overflow: hidden; }
  .contador button { border: 0; background: transparent; width: 36px; height: 34px; font-size: 18px; font-weight: 800; cursor: pointer; color: var(--acento); }
  .contador span { min-width: 34px; text-align: center; font-weight: 800; }
  .presets { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .preset { text-align: left; padding: 14px; border-radius: 16px; border: 1px solid var(--linea); background: var(--sup-fuerte); cursor: pointer; }
  .preset:hover { border-color: var(--acento); } .preset b { display: flex; gap: 8px; align-items: center; } .preset span { font-size: 13px; color: var(--suave); }
  .guardar-fijo { position: sticky; bottom: 14px; z-index: 10; display: flex; gap: 10px; justify-content: flex-end; align-items: center; padding: 12px 14px; margin-top: 16px; }
  .compartir-codigo { font-size: 34px; font-weight: 800; letter-spacing: .1em; text-align: center; padding: 18px; border-radius: 18px; background: var(--sup2); }
  #qr { display: grid; place-items: center; padding: 14px; background: #fff; border-radius: 16px; width: max-content; margin: 0 auto; }
  /* Resultados */
  .histo { display: flex; align-items: flex-end; gap: 6px; height: 160px; padding: 10px 4px 0; }
  .histo div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
  .histo i { width: 100%; border-radius: 8px 8px 4px 4px; background: var(--marca); min-height: 3px; transition: height .4s; }
  .histo i.bajo { background: linear-gradient(180deg, #FF8A8E, #E5484D); } .histo i.medio { background: linear-gradient(180deg, #FFD36B, #D98E04); }
  .histo small { font-size: 11px; color: var(--tenue); } .histo em { font-style: normal; font-size: 12px; font-weight: 800; }
  .dos { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; margin-bottom: 16px; }
  @media (max-width: 1000px) { .dos { grid-template-columns: 1fr; } }
  .pq { padding: 14px 16px; border-radius: 16px; background: var(--sup-fuerte); border: 1px solid var(--linea); margin-bottom: 10px; }
  .pq .linea { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
  .dist { display: grid; gap: 4px; margin-top: 8px; }
  .dist div { display: grid; grid-template-columns: 1fr 120px 36px; gap: 8px; align-items: center; font-size: 13px; }
  .dist .b { height: 6px; border-radius: 9px; background: var(--sup2); overflow: hidden; } .dist .b i { display: block; height: 100%; background: var(--rojo); }
  .dist .ok .b i { background: var(--verde); }
  .chips-n { display: flex; flex-wrap: wrap; gap: 6px; }
  .cargando { display: grid; place-items: center; padding: 60px; color: var(--suave); }
  .girar { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--sup2); border-top-color: var(--acento); animation: gira 0.8s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="fondo"><i></i><i></i><i></i><i></i></div>

<!-- Acceso -->
<section id="vAcceso" class="acceso">
  <div class="vidrio">
    <div class="heroe"><div class="logo-b" id="logoA"></div><h1>Panel docente</h1><p>Crea exámenes, elige las reglas y mira los resultados en vivo.</p></div>
    <div style="padding:22px 26px 26px">
      <div class="segmento" style="margin-bottom:16px"><button class="on" data-acc="entrar">Entrar</button><button data-acc="activar">Activar mi cuenta</button></div>
      <form id="fEntrar">
        <label class="campo"><span>Usuario</span><input class="entrada" id="aUsuario" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="nombre.apellido"></label>
        <label class="campo"><span>Contraseña</span><input class="entrada" id="aClave" type="password" autocomplete="current-password"></label>
        <div class="error" id="aError"></div>
        <button class="btn primario ancho" type="submit">Entrar</button>
      </form>
      <form id="fActivar" class="oculto">
        <p class="suave pequeno" style="margin-top:0">La coordinación te entrega tu usuario y un código de activación. Aquí creas tu propia contraseña.</p>
        <label class="campo"><span>Usuario</span><input class="entrada" id="vUsuario" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
        <label class="campo"><span>Código de activación</span><input class="entrada" id="vCodigo" autocomplete="off" autocapitalize="characters" placeholder="XXXX-XXXX"></label>
        <label class="campo"><span>Nueva contraseña (mínimo 8)</span><input class="entrada" id="vClave" type="password" autocomplete="new-password"></label>
        <label class="campo"><span>Repite la contraseña</span><input class="entrada" id="vClave2" type="password" autocomplete="new-password"></label>
        <div class="error" id="vError"></div>
        <button class="btn primario ancho" type="submit">Activar y entrar</button>
      </form>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px"><a href="index.html" class="pequeno">Ir a la página del estudiante</a><div class="tema"></div></div>
    </div>
  </div>
</section>

<!-- Aplicación -->
<div id="vApp" class="app oculto">
  <aside class="lateral">
    <div class="marca-l"><div class="logo" id="logoL"></div><div><b>Examen Seguro</b><span>Politécnico C. James Davis</span></div></div>
    <div id="menu" style="display:contents"></div>
    <div class="yo"><div class="avatar" id="yoIni"></div><div style="min-width:0;flex:1"><b id="yoNombre"></b><span id="yoRol"></span></div></div>
    <div class="solo-escritorio" style="display:flex;justify-content:space-between;align-items:center;padding:8px 4px 0"><div class="tema"></div><button class="btn fantasma mini" id="btnSalirApp"></button></div>
  </aside>
  <main class="contenido" id="pagina"></main>
</div>

<div class="modal oculto" id="modal"><div class="tarjeta" id="modalCaja"></div></div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var S = { token: '', yo: null, panel: null, vista: 'inicio', vivo: null };
  var WEB = location.href.replace(/docente\.html.*$/, '');
  $('logoA').innerHTML = ICO('escudo'); $('logoL').innerHTML = ICO('escudo'); $('btnSalirApp').innerHTML = ICO('salir') + ' Salir';
  try { S.token = sessionStorage.getItem('es-token') || ''; } catch (e) {}

  /* ---------- Llamadas con sesión ---------- */
  function A(datos) {
    return API(Object.assign({ token: S.token }, datos)).catch(function (e) {
      if (e.sesion === 'fin') { cerrarSesion(); AVISO(e.message, 'error'); }
      throw e;
    });
  }
  function cargando(msg) { $('pagina').innerHTML = '<div class="cargando"><div class="girar"></div><p>' + esc(msg || 'Cargando…') + '</p></div>'; }
  function cerrarSesion() { try { sessionStorage.removeItem('es-token'); } catch (e) {} S.token = ''; parar(); $('vApp').classList.add('oculto'); $('vAcceso').classList.remove('oculto'); }
  function parar() { if (S.vivo) { clearInterval(S.vivo); S.vivo = null; } }

  /* ---------- Acceso ---------- */
  document.querySelectorAll('[data-acc]').forEach(function (b) {
    b.onclick = function () {
      document.querySelectorAll('[data-acc]').forEach(function (x) { x.classList.toggle('on', x === b); });
      $('fEntrar').classList.toggle('oculto', b.dataset.acc !== 'entrar'); $('fActivar').classList.toggle('oculto', b.dataset.acc !== 'activar');
    };
  });
  $('fEntrar').onsubmit = function (e) {
    e.preventDefault(); $('aError').textContent = '';
    var b = e.submitter || this.querySelector('button'); b.disabled = true;
    API({ action: 'login', usuario: $('aUsuario').value, clave: $('aClave').value }).then(entrar).catch(function (er) { $('aError').textContent = er.message; }).then(function () { b.disabled = false; });
  };
  $('fActivar').onsubmit = function (e) {
    e.preventDefault(); $('vError').textContent = '';
    if ($('vClave').value !== $('vClave2').value) { $('vError').textContent = 'Las contraseñas no son iguales.'; return; }
    var b = this.querySelector('button'); b.disabled = true;
    API({ action: 'activar', usuario: $('vUsuario').value, codigo: $('vCodigo').value, clave: $('vClave').value }).then(entrar).catch(function (er) { $('vError').textContent = er.message; }).then(function () { b.disabled = false; });
  };
  function entrar(r) {
    S.token = r.token; S.yo = r.yo; try { sessionStorage.setItem('es-token', r.token); } catch (e) {}
    $('aClave').value = ''; $('vClave').value = ''; $('vClave2').value = '';
    abrirApp();
  }
  $('btnSalirApp').onclick = function () { A({ action: 'salir' }).catch(function () {}); cerrarSesion(); };

  function abrirApp() {
    $('vAcceso').classList.add('oculto'); $('vApp').classList.remove('oculto'); cargando('Abriendo tu panel…');
    return A({ action: 'panel' }).then(function (p) {
      S.panel = p; S.yo = p.yo;
      $('yoNombre').textContent = p.yo.nombre; $('yoRol').textContent = p.yo.rol === 'ADMIN' ? 'Coordinación' : 'Docente';
      $('yoIni').textContent = p.yo.nombre.split(' ').map(function (x) { return x[0]; }).slice(0, 2).join('');
      var items = [['inicio', 'inicio', 'Inicio'], ['examenes', 'examen', 'Exámenes'], ['estudiantes', 'usuarios', 'Estudiantes']];
      if (p.yo.rol === 'ADMIN') items.push(['docentes', 'docentes', 'Docentes']);
      items.push(['cuenta', 'cuenta', 'Mi cuenta']);
      $('menu').innerHTML = items.map(function (x) { return '<button class="nav" data-ir="' + x[0] + '">' + ICO(x[1]) + '<span>' + x[2] + '</span></button>'; }).join('');
      ir(S.vista === 'editor' || S.vista === 'resultados' ? 'inicio' : S.vista);
    }).catch(function (e) { if (e.sesion !== 'fin') $('pagina').innerHTML = '<div class="tarjeta"><b>No se pudo abrir el panel.</b><p class="suave">' + esc(e.message) + '</p></div>'; });
  }
  $('menu').addEventListener('click', function (e) { var b = e.target.closest('[data-ir]'); if (b) ir(b.dataset.ir); });
  function ir(v, arg) {
    parar(); S.vista = v; window.scrollTo(0, 0); $('pagina').onclick = null;
    document.querySelectorAll('.nav').forEach(function (n) { n.classList.toggle('on', n.dataset.ir === v || (v === 'editor' || v === 'resultados') && n.dataset.ir === 'examenes'); });
    ({ inicio: inicio, examenes: examenes, estudiantes: estudiantes, docentes: docentes, cuenta: cuenta, editor: editor, resultados: resultados })[v](arg);
  }
  function refrescarPanel() { return A({ action: 'panel' }).then(function (p) { S.panel = p; }); }

  /* ---------- Piezas ---------- */
  function cabeza(titulo, sub, botones) { return '<div class="cabeza"><div class="tit"><h1>' + titulo + '</h1>' + (sub ? '<p class="suave" style="margin:0">' + sub + '</p>' : '') + '</div>' + (botones || '') + '</div>'; }
  function kpi(ico, color, valor, texto) { return '<div class="kpi tarjeta"><span class="chip-ico ' + color + '">' + ICO(ico) + '</span><div><b>' + valor + '</b><span>' + texto + '</span></div></div>'; }
  function claseNota(n) { return n >= 70 ? '' : n >= 50 ? 'medio' : 'bajo'; }
  function estadoExamen(e) {
    var ahora = new Date().toISOString().slice(0, 16).replace('T', ' ');
    if (!e.activo) return '<span class="pildora">Inactivo</span>';
    if (e.enCurso) return '<span class="pildora verde"><span class="punto vivo"></span>' + e.enCurso + ' en curso</span>';
    if (e.inicio && e.inicio > ahora) return '<span class="pildora azul">' + ICO('reloj') + ' Abre ' + FECHA(e.inicio) + '</span>';
    if (e.fin && e.fin < ahora) return '<span class="pildora">Cerrado</span>';
    return '<span class="pildora morado"><span class="punto"></span>Abierto</span>';
  }
  function modal(html, ancho) { $('modalCaja').innerHTML = html; $('modal').classList.toggle('ancho', !!ancho); $('modal').classList.remove('oculto'); }
  function cerrarModal() { $('modal').classList.add('oculto'); }
  $('modal').addEventListener('click', function (e) { if (e.target === $('modal') || e.target.closest('[data-cerrar]')) cerrarModal(); });
  function confirmar(titulo, texto, si, accion, peligro) {
    modal('<h2>' + esc(titulo) + '</h2><p class="suave">' + esc(texto) + '</p><div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px"><button class="btn claro" data-cerrar>Cancelar</button><button class="btn ' + (peligro ? 'peligro' : 'primario') + '" id="mOk">' + esc(si) + '</button></div>');
    $('mOk').onclick = function () { cerrarModal(); accion(); };
  }
  function copiar(t) { (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { AVISO('Copiado'); }).catch(function () { prompt('Copia esto:', t); }); }
  window.__copiar = copiar;

  /* ---------- Inicio ---------- */
  function inicio() {
    var p = S.panel, ex = p.examenes, hora = new Date().getHours();
    var activos = ex.filter(function (e) { return e.activo; }).length, hoy = ex.reduce(function (a, e) { return a + e.hoy; }, 0), vivo = ex.reduce(function (a, e) { return a + e.enCurso; }, 0);
    var conProm = ex.filter(function (e) { return e.promedio !== null; }), ent = ex.reduce(function (a, e) { return a + e.entregados; }, 0);
    var prom = conProm.length ? Math.round(conProm.reduce(function (a, e) { return a + e.promedio * e.entregados; }, 0) / Math.max(1, conProm.reduce(function (a, e) { return a + e.entregados; }, 0))) : '—';
    var saludo = hora < 12 ? 'Buenos días' : hora < 18 ? 'Buenas tardes' : 'Buenas noches';
    $('pagina').innerHTML = cabeza(saludo + ', ' + esc(p.yo.nombre.split(' ')[0]) + ' 👋', 'Esto es lo que pasa hoy con tus exámenes.', '<button class="btn primario" data-nuevo>' + ICO('mas') + ' Nuevo examen</button>') +
      '<div class="kpis">' + kpi('examen', '', activos, 'Exámenes activos') + kpi('vivo', 'verde', vivo, 'Haciendo examen ahora') + kpi('check', 'azul', hoy, 'Intentos hoy') + kpi('premio', 'amarillo', prom, 'Promedio general (' + ent + ' entregas)') + '</div>' +
      (vivo ? '<div class="tarjeta" style="margin-bottom:16px"><h3>' + ICO('vivo') + ' En vivo ahora</h3><div class="chips-n">' + ex.filter(function (e) { return e.enCurso; }).map(function (e) {
        return '<button class="btn claro mini" data-res="' + e.id + '"><span class="pildora verde"><span class="punto vivo"></span>' + e.enCurso + '</span> ' + esc(e.titulo) + '</button>'; }).join('') + '</div></div>' : '') +
      '<h2 style="margin:6px 0 12px">Recientes</h2>' + (ex.length ? '<div class="rejilla">' + ex.slice(0, 6).map(tarjetaExamen).join('') + '</div>' :
        '<div class="tarjeta vacio"><div class="chip-ico">' + ICO('examen') + '</div><h3 style="justify-content:center">Todavía no tienes exámenes</h3><p>Crea el primero en menos de 3 minutos: escribe o pega tus preguntas y elige las reglas.</p><button class="btn primario" data-nuevo>' + ICO('mas') + ' Crear mi primer examen</button></div>');
  }
  function tarjetaExamen(e) {
    var prac = e.modo === 'PRACTICA';

      '<textarea class="entrada" id="impTxt" style="min-height:260px;font-family:ui-monospace,Consolas,monospace;font-size:13.5px" placeholder="1. ¿Qué instrucción muestra un valor en pantalla?\na) Leer\n*b) Escribir\nc) Definir\nd) Mientras\nExplicación: Escribir muestra datos.\n\n2. El tipo Real guarda decimales.\nRespuesta: V\n\n3. Símbolo químico del sodio\nRespuesta: Na | sodio"></textarea>' +
      '<div id="impVista" class="pequeno suave" style="margin:8px 0"></div><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn claro" data-cerrar>Cancelar</button><button class="btn primario" id="impOk" disabled>Agregar</button></div>', true);
    var lista = [];
    $('impTxt').oninput = function () { lista = analizar(this.value); var mal = lista.filter(function (q) { return q.error; });
      $('impVista').innerHTML = lista.length ? '<b>' + (lista.length - mal.length) + ' listas</b>' + (mal.length ? ' · <span style="color:var(--rojo)">' + mal.length + ' con problemas: ' + mal.map(function (q) { return esc(q.error); }).join('; ') + '</span>' : '') : '';
      $('impOk').disabled = !lista.some(function (q) { return !q.error; }); };
    $('impOk').onclick = function () { var ok = lista.filter(function (q) { return !q.error; }); ok.forEach(function (q) { delete q.error; E.preguntas.push(q); }); cerrarModal(); AVISO(ok.length + ' preguntas agregadas'); pasoPreguntas(); };
  }
  function analizar(txt) {
    return txt.replace(/\r/g, '').split(/\n\s*\n/).map(function (b) { return b.trim(); }).filter(Boolean).map(function (b, n) {
      var lin = b.split('\n').map(function (l) { return l.trim(); }).filter(Boolean), q = { tipo: 'MC', enunciado: '', opciones: [], correcta: '', puntos: 1, explicacion: '', tema: '' }, enun = [], resp = '';
      lin.forEach(function (l) {
        var m;
        if ((m = l.match(/^(respuesta|r)\s*[:=]\s*(.+)$/i))) resp = m[2].trim();
        else if ((m = l.match(/^(explicaci[oó]n|e)\s*[:=]\s*(.+)$/i))) q.explicacion = m[2].trim();
        else if ((m = l.match(/^(tema)\s*[:=]\s*(.+)$/i))) q.tema = m[2].trim();
        else if ((m = l.match(/^(\*)?\s*(?:[a-hA-H][\)\.]|[-•])\s+(.+?)\s*(\*|✔|\(x\))?$/))) { var o = m[2].trim(); q.opciones.push(o); if (m[1] || m[3]) q.correcta = o; }
        else enun.push(l);
      });
      q.enunciado = enun.join('\n').replace(/^\d+\s*[\.\)\-]\s*/, '');
      if (!q.opciones.length) {
        if (/^(v|verdadero|f|falso)$/i.test(resp)) { q.tipo = 'VF'; q.opciones = ['Verdadero', 'Falso']; q.correcta = /^v/i.test(resp) ? 'Verdadero' : 'Falso'; }
        else { q.tipo = 'CORTA'; q.correcta = resp.split('|').map(function (s) { return s.trim(); }).filter(Boolean).join('|'); }
      } else if (resp && !q.correcta) { var k = resp.toLowerCase().charCodeAt(0) - 97; q.correcta = q.opciones[k] || q.opciones.find(function (o) { return o.toLowerCase() === resp.toLowerCase(); }) || ''; }
      if (!q.enunciado) q.error = '#' + (n + 1) + ' sin pregunta';
      else if (!q.correcta) q.error = '#' + (n + 1) + ' sin respuesta correcta';
      else if (q.tipo === 'MC' && q.opciones.length < 2) q.error = '#' + (n + 1) + ' con menos de 2 opciones';
      return q;
    });
  }

    $('pagina').innerHTML = cabeza('Estudiantes', 'Las listas que ven tus estudiantes al entrar a un examen.') +
      '<div class="filtros"><select class="entrada" id="eCurso">' + cursos.map(function (c) { return '<option>' + esc(c) + '</option>'; }).join('') + '</select><span class="suave pequeno" id="eCuenta"></span></div>' +
      '<div class="dos"><div class="tarjeta desliza" id="eLista"></div><div class="tarjeta"><h3>' + ICO('mas') + ' Agregar estudiantes</h3><p class="suave pequeno">Pega los nombres, uno por línea (puedes copiarlos de Excel).</p>' +
      '<textarea class="entrada" id="ePegar" style="min-height:180px" placeholder="Ana María Pérez\nLuis Gómez"></textarea><button class="btn primario" id="eAgregar" style="margin-top:10px">' + ICO('check') + ' Agregar a la lista</button></div></div>';
    function cargar() {
      var c = $('eCurso').value; if (!c) { $('eLista').innerHTML = '<p class="suave">No tienes cursos asignados.</p>'; return; }
      $('eLista').innerHTML = '<div class="girar" style="margin:20px auto"></div>';
      A({ action: 'estudiantes', curso: c }).then(function (r) {
        $('eCuenta').textContent = r.estudiantes.filter(function (s) { return s.activo; }).length + ' activos';
        $('eLista').innerHTML = r.estudiantes.length ? '<table class="tabla"><thead><tr><th>#</th><th>Nombre</th><th>En la lista</th></tr></thead><tbody>' + r.estudiantes.map(function (s, i) {
          return '<tr><td class="tenue">' + (i + 1) + '</td><td>' + esc(s.nombre) + '</td><td><label class="interruptor"><input type="checkbox" data-est="' + s.id + '"' + (s.activo ? ' checked' : '') + '><i></i></label></td></tr>'; }).join('') + '</tbody></table>'
          : '<div class="vacio"><p>Este curso todavía no tiene lista.</p></div>';
      }).catch(function (e) { $('eLista').innerHTML = '<p class="error">' + esc(e.message) + '</p>'; });
    }
    $('eCurso').onchange = cargar;
    $('eLista').onchange = function (e) { var id = e.target.dataset.est; if (id) A({ action: 'guardarEstudiantes', curso: $('eCurso').value, id: id, activo: e.target.checked }).then(function () { AVISO(e.target.checked ? 'Activado' : 'Quitado de la lista'); }).catch(function (er) { AVISO(er.message, 'error'); }); };
    $('eAgregar').onclick = function () { A({ action: 'guardarEstudiantes', curso: $('eCurso').value, pegado: $('ePegar').value }).then(function (r) { AVISO(r.nuevos + ' agregados'); $('ePegar').value = ''; cargar(); }).catch(function (er) { AVISO(er.message, 'error'); }); };
    cargar();
  }

  /* ---------- Docentes (coordinación) ---------- */
  function docentes() {
    cargando('Cargando docentes…');
    Promise.all([A({ action: 'docentes' }), A({ action: 'asignaciones' })]).then(function (rs) {
      var ds = rs[0].docentes, asig = rs[1].asignaciones;
      $('pagina').innerHTML = cabeza('Docentes', ds.length + ' docentes · ' + ds.filter(function (d) { return d.activado; }).length + ' ya activaron su cuenta', '<button class="btn primario" id="dNuevo">' + ICO('mas') + ' Agregar docente</button>') +
        '<div class="tarjeta" style="margin-bottom:14px"><b>' + ICO('llave') + ' Cómo entra cada docente</b><p class="suave pequeno" style="margin:6px 0 0">Entrégale su <b>usuario</b> y su <b>código de activación</b>. En «Activar mi cuenta» crea su contraseña; el código deja de servir. Si olvida la contraseña, usa «Reiniciar acceso» para darle un código nuevo.</p></div>' +
        '<div class="tarjeta desliza"><table class="tabla"><thead><tr><th>Docente</th><th>Usuario</th><th>Acceso</th><th>Materias</th><th>Último acceso</th><th></th></tr></thead><tbody>' + ds.map(function (d) {
          return '<tr style="' + (d.activo ? '' : 'opacity:.5') + '"><td><b>' + esc(d.nombre) + '</b> ' + (d.rol === 'ADMIN' ? '<span class="pildora morado">Coordinación</span>' : '') + '</td><td><code>' + esc(d.usuario) + '</code></td>' +
            '<td>' + (d.activado ? '<span class="pildora verde">' + ICO('check') + ' Activada</span>' : '<span class="pildora amarillo" title="Código de activación">' + ICO('llave') + ' ' + esc(d.activacion) + '</span> <button class="btn fantasma icono" data-cp="Usuario: ' + esc(d.usuario) + ' · Código de activación: ' + esc(d.activacion) + '" title="Copiar">' + ICO('copiar') + '</button>') + '</td>' +
            '<td><button class="btn fantasma mini" data-asig="' + d.id + '">' + ICO('libro') + ' ' + d.materias + '</button></td><td class="pequeno suave">' + FECHA(d.ultimoAcceso) + '</td>' +
            '<td style="white-space:nowrap"><button class="btn fantasma mini" data-reini="' + d.id + '">' + ICO('recargar') + ' Reiniciar acceso</button><button class="btn fantasma icono" data-rol="' + d.id + '" data-r="' + d.rol + '" title="Cambiar rol">' + ICO('docentes') + '</button>' +
            '<button class="btn fantasma icono" data-act="' + d.id + '" data-a="' + (d.activo ? 1 : 0) + '" title="' + (d.activo ? 'Desactivar' : 'Activar') + '">' + ICO(d.activo ? 'x' : 'check') + '</button></td></tr>';
        }).join('') + '</tbody></table></div>';
      var guardar = function (doc, msg) { A({ action: 'guardarDocente', docente: doc }).then(function () { AVISO(msg); docentes(); }).catch(function (er) { AVISO(er.message, 'error'); }); };
      $('pagina').onclick = function (e) {
        var b = e.target.closest('[data-cp],[data-reini],[data-rol],[data-act],[data-asig],#dNuevo'); if (!b) return;
        if (b.dataset.cp) copiar(b.dataset.cp);
        if (b.id === 'dNuevo') { modal('<h2>' + ICO('mas') + ' Agregar docente</h2><label class="campo"><span>Nombre completo</span><input class="entrada" id="dnNombre"></label><label class="campo"><span>Rol</span><select class="entrada" id="dnRol"><option value="DOCENTE">Docente</option><option value="ADMIN">Coordinación (ve todo)</option></select></label><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn claro" data-cerrar>Cancelar</button><button class="btn primario" id="dnOk">Agregar</button></div>');
          $('dnOk').onclick = function () { cerrarModal(); guardar({ nombre: $('dnNombre').value, rol: $('dnRol').value }, 'Docente agregado'); }; }
        if (b.dataset.reini) confirmar('¿Reiniciar el acceso?', 'Su contraseña deja de servir y se crea un código de activación nuevo.', 'Reiniciar', function () { guardar({ id: b.dataset.reini, reiniciar: true }, 'Código nuevo creado'); });
        if (b.dataset.rol) guardar({ id: b.dataset.rol, rol: b.dataset.r === 'ADMIN' ? 'DOCENTE' : 'ADMIN' }, 'Rol cambiado');
        if (b.dataset.act) guardar({ id: b.dataset.act, activo: b.dataset.a !== '1' }, b.dataset.a === '1' ? 'Desactivado' : 'Activado');
        if (b.dataset.asig) { var d = ds.find(function (x) { return x.id === b.dataset.asig; }); editarAsignaciones(d, asig); }
      };
    }).catch(function (e) { $('pagina').innerHTML = '<div class="tarjeta"><p class="error">' + esc(e.message) + '</p></div>'; });
  }
  function editarAsignaciones(d, todas) {
    var mias = todas.filter(function (a) { return a.docenteId === d.id; });
    modal('<h2>' + ICO('libro') + ' ' + esc(d.nombre) + '</h2><p class="suave pequeno">Cursos y materias que puede usar en sus exámenes.</p><div class="chips-n" style="margin-bottom:14px">' + (mias.length ? mias.map(function (a) {
      return '<span class="pildora morado">' + esc(a.curso + ' · ' + a.materia) + ' <button class="btn fantasma icono" style="width:22px;height:22px" data-quita="' + a.id + '">' + ICO('x') + '</button></span>'; }).join('') : '<span class="suave">Sin asignaciones</span>') + '</div>' +
      '<div class="fila"><input class="entrada" id="asCurso" placeholder="Curso (ej. 4toA)"><input class="entrada" id="asMat" placeholder="Materia"></div><div style="display:flex;gap:10px;justify-content:flex-end;margin-top:12px"><button class="btn claro" data-cerrar>Cerrar</button><button class="btn primario" id="asOk">' + ICO('mas') + ' Agregar</button></div>');
    $('modalCaja').onclick = function (e) { var q = e.target.closest('[data-quita]'); if (q) A({ action: 'guardarAsignacion', eliminar: q.dataset.quita }).then(function () { cerrarModal(); AVISO('Quitada'); docentes(); }); };
    $('asOk').onclick = function () { A({ action: 'guardarAsignacion', docenteId: d.id, curso: $('asCurso').value, materia: $('asMat').value }).then(function () { cerrarModal(); AVISO('Asignación agregada'); docentes(); }).catch(function (er) { AVISO(er.message, 'error'); }); };
  }

  /* ---------- Mi cuenta ---------- */
  function cuenta() {
    var y = S.panel.yo;
    $('pagina').innerHTML = cabeza('Mi cuenta') + '<div class="dos"><div class="tarjeta"><div style="display:flex;gap:14px;align-items:center"><div class="avatar" style="width:56px;height:56px;font-size:20px">' + esc($('yoIni').textContent) + '</div><div><h2 style="margin:0">' + esc(y.nombre) + '</h2><span class="suave">' + esc(y.usuario) + ' · ' + (y.rol === 'ADMIN' ? 'Coordinación' : 'Docente') + '</span></div></div>' +
      '<h3 style="margin-top:18px">' + ICO('libro') + ' Mis cursos y materias</h3><div class="chips-n">' + (S.panel.asignaciones.length ? S.panel.asignaciones.map(function (a) { return '<span class="pildora morado">' + esc(a.curso + ' · ' + a.materia) + '</span>'; }).join('') : '<span class="suave">Pídele a la coordinación que te asigne tus materias.</span>') + '</div>' +
      '<h3 style="margin-top:18px">' + ICO('ajustes') + ' Apariencia</h3><div class="tema"></div></div>' +
      '<form class="tarjeta" id="fClave"><h3>' + ICO('llave') + ' Cambiar contraseña</h3><label class="campo"><span>Contraseña actual</span><input class="entrada" type="password" id="cActual" autocomplete="current-password"></label>' +
      '<label class="campo"><span>Nueva (mínimo 8)</span><input class="entrada" type="password" id="cNueva" autocomplete="new-password"></label><label class="campo"><span>Repite la nueva</span><input class="entrada" type="password" id="cNueva2" autocomplete="new-password"></label>' +
      '<div class="error" id="cError"></div><button class="btn primario">' + ICO('check') + ' Guardar contraseña</button></form></div>';
    var g = $('pagina').querySelector('.tema'); g.innerHTML = '<button type="button" data-tema="light">' + ICO('sol') + '</button><button type="button" data-tema="dark">' + ICO('luna') + '</button>';
    g.onclick = function (e) { var b = e.target.closest('[data-tema]'); if (b) TEMA(b.dataset.tema); }; TEMA(document.documentElement.getAttribute('data-theme'));
    $('fClave').onsubmit = function (e) {
      e.preventDefault(); $('cError').textContent = '';
      if ($('cNueva').value !== $('cNueva2').value) { $('cError').textContent = 'Las contraseñas nuevas no son iguales.'; return; }
      A({ action: 'cambiarClave', actual: $('cActual').value, clave: $('cNueva').value }).then(function () { AVISO('Contraseña cambiada'); e.target.reset(); }).catch(function (er) { $('cError').textContent = er.message; });
    };
  }

  /* Arranque: si hay sesión guardada, entra directo */
  if (S.token) abrirApp().catch(function () {});
})();
</script>
</body>
</html>
