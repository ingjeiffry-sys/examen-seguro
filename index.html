<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Examen Seguro</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="es.css?v=4">
<script src="config.js?v=3"></script>
<script src="es.js?v=7"></script>
<script src="tipos.js?v=1"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
<style>
  .centro { min-height: 100vh; display: grid; place-items: center; padding: 20px 16px 90px; }
  .portada { width: min(480px, 100%); padding: 0; overflow: hidden; }
  .heroe { padding: 28px 26px 24px; color: #fff; background: var(--marca); position: relative; overflow: hidden; }
  .heroe::after { content: ''; position: absolute; width: 260px; height: 260px; right: -80px; top: -110px; border-radius: 50%; background: rgb(255 255 255 / .14); }
  .heroe .logo { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: rgb(255 255 255 / .2); margin-bottom: 18px; }
  .heroe .logo .ico { width: 28px; height: 28px; }
  .heroe h1 { color: #fff; } .heroe p { margin: 0; color: rgb(255 255 255 / .86); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; position: relative; z-index: 1; }
  .chips span { display: inline-flex; gap: 6px; align-items: center; padding: 6px 11px; border-radius: 999px; background: rgb(255 255 255 / .2); font-size: 13px; font-weight: 700; }
  .chips .ico { width: 16px; height: 16px; }
  .cuerpo { padding: 22px 26px 26px; }
  .codigo-in { font-size: 22px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; text-align: center; padding: 16px; }
  .reglas { display: grid; gap: 8px; margin: 14px 0; }
  .regla { display: flex; gap: 12px; align-items: flex-start; padding: 11px 12px; border-radius: 14px; background: var(--sup2); font-size: 14.5px; }
  .regla .chip-ico { width: 34px; height: 34px; border-radius: 11px; }
  .regla b { display: block; }
  .pie-portada { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; font-size: 13px; }
  .barra { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 10px 16px; margin: 0;
    background: var(--sup-fuerte); border-bottom: 1px solid var(--linea); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }
  .barra .tit { flex: 1; min-width: 0; } .barra .tit b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .reloj { display: inline-flex; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; font-weight: 800; font-size: 18px; padding: 8px 14px; border-radius: 999px; background: var(--morado-t); color: var(--acento); }
  .reloj.poco { background: var(--rojo); color: #fff; animation: pulso 1s infinite; }
  .progreso { height: 4px; background: var(--sup2); } .progreso i { display: block; height: 100%; width: 0; background: var(--marca); transition: width .3s; }
  .zona { max-width: 1120px; margin: 0 auto; padding: 18px 16px 120px; display: grid; grid-template-columns: 1fr 260px; gap: 18px; align-items: start; }
  @media (max-width: 860px) { .zona { grid-template-columns: 1fr; } .navegador { position: static !important; order: -1; } }
  .navegador { position: sticky; top: 84px; padding: 16px; }
  .numeros { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; margin: 10px 0 14px; }
  .numeros button { aspect-ratio: 1; border-radius: 11px; border: 1px solid var(--linea); background: var(--sup-fuerte); font-weight: 700; cursor: pointer; position: relative; }
  .numeros button.hecha { background: var(--acento); color: var(--sobre-acento); border-color: var(--acento); }
  .numeros button.marcada::after { content: ''; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--amarillo); }
  .leyenda { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--suave); }
  .leyenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .pregunta { padding: 20px 22px; margin-bottom: 14px; scroll-margin-top: 90px; }
  .pregunta .cab { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .num { min-width: 34px; height: 34px; padding: 0 8px; border-radius: 11px; display: grid; place-items: center; font-weight: 800; background: var(--marca); color: #fff; }
  .pregunta .cab .pts { margin-left: auto; }
  .marcar { border: 0; background: var(--sup2); color: var(--suave); border-radius: 999px; padding: 6px 10px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 700; }
  .marcar.on { background: var(--amarillo-t); color: var(--amarillo); }
  .enunciado { font-size: 16.5px; font-weight: 650; line-height: 1.5; white-space: pre-line; margin: 0 0 14px; }
  .ia { font-size: 12px; color: var(--tenue); font-style: italic; margin: -6px 0 12px; }
  .op { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 16px; margin: 8px 0; cursor: pointer; background: var(--sup-fuerte);
    border: 1.5px solid var(--linea); transition: border .15s, background .15s, transform .12s; white-space: pre-line; }
  .op:hover { border-color: color-mix(in srgb, var(--acento) 45%, transparent); }
  .op:active { transform: scale(.995); }
  .op input { position: absolute; opacity: 0; pointer-events: none; }
  .letra { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 14px; background: var(--sup2); color: var(--acento); }
  .op.sel { border-color: var(--acento); background: color-mix(in srgb, var(--acento) 10%, var(--sup-fuerte)); }
  .op.sel .letra { background: var(--acento); color: var(--sobre-acento); }
  .op:focus-within { outline: 3px solid color-mix(in srgb, var(--acento) 35%, transparent); outline-offset: 2px; }
  .marca-agua { position: fixed; inset: 0; z-index: 0; pointer-events: none; display: grid; place-items: center; font-size: 5rem; font-weight: 800; color: var(--texto); opacity: .035; transform: rotate(-24deg); white-space: nowrap; }
  .bloqueado .zona { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .bloqueado .zona input { -webkit-user-select: text; user-select: text; }
  .entregar-fijo { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: 10px;
    background: linear-gradient(transparent, var(--fondo) 40%); }
  .anillo { width: 168px; height: 168px; border-radius: 50%; margin: 6px auto 12px; display: grid; place-items: center; background: conic-gradient(var(--c, var(--acento)) calc(var(--p) * 1%), var(--sup2) 0); }
  .anillo div { width: 136px; height: 136px; border-radius: 50%; background: var(--sup-solida); display: grid; place-items: center; text-align: center; }
  .anillo b { font-size: 40px; letter-spacing: -.04em; display: block; line-height: 1; } .anillo small { color: var(--suave); }
  .rev { padding: 14px 16px; border-radius: 16px; margin: 10px 0; background: var(--sup-fuerte); border: 1px solid var(--linea); border-left: 5px solid var(--verde); white-space: pre-line; }
  .rev.mal { border-left-color: var(--rojo); }
  .rev .r { display: flex; gap: 8px; align-items: flex-start; margin-top: 6px; font-size: 14.5px; }
  .tema-fijo { position: fixed; left: 14px; bottom: 14px; z-index: 30; }
  .examen-activo .tema-fijo { bottom: 80px; }
  /* Una pregunta por página */
  .unapag .pregunta.fuera { display: none; }
  .pag-nav { display: flex; gap: 10px; align-items: center; justify-content: space-between; margin: 6px 0 100px; }
  .pag-nav .cuenta { font-weight: 700; color: var(--suave); }
  .pag-nav .btn { min-width: 140px; }
  #eNumeros button:disabled { opacity: .35; cursor: not-allowed; }
  #eNumeros button.actual { outline: 3px solid var(--acento); outline-offset: 2px; opacity: 1; }
  .aviso-adelante { padding: 10px 14px; border-radius: 14px; background: var(--sup2); font-size: 14px; margin-bottom: 12px; display: flex; gap: 8px; align-items: center; }
  /* Tipos dinámicos */
  .ayuda-tipo { font-size: 13.5px; color: var(--suave); display: flex; gap: 6px; align-items: center; margin: 4px 0 10px; }
  .ayuda-tipo .ico { width: 16px; height: 16px; }
  .orden { display: flex; flex-direction: column; gap: 8px; }
  .orden .it { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--sup-fuerte); border: 1px solid var(--linea); cursor: grab; touch-action: none; }
  .orden .asa { color: var(--tenue); font-size: 18px; line-height: 1; }
  .orden .caja { flex: 1; position: relative; }
  .orden .fl { display: flex; gap: 4px; }
  .orden .fl button { width: 32px; height: 32px; border-radius: 10px; border: 1px solid var(--linea); background: var(--sup-solida); color: var(--acento); cursor: pointer; display: grid; place-items: center; padding: 0; }
  .orden .fl .ico { width: 16px; height: 16px; }
  .orden.algoritmo .tx { font-family: ui-monospace, Consolas, monospace; white-space: pre; font-size: 14.5px; }
  .sortable-ghost { opacity: .35; } .sortable-chosen, .sortable-fallback { box-shadow: var(--sombra); }
  .orden.flujo { gap: 24px; }
  .orden.flujo .it { background: transparent; border: 0; padding: 0; }
  .orden.flujo .caja { padding: 14px 18px; text-align: center; font-weight: 700; border: 2px solid var(--acento); border-radius: 8px; background: var(--sup-fuerte); }
  .orden.flujo .it:not(:last-child) .caja::after { content: ''; position: absolute; left: 50%; top: 100%; margin-top: 2px; width: 2px; height: 20px; background: var(--acento); }
  .orden.flujo .caja.f-term { border-radius: 999px; border-color: #10B981; background: color-mix(in srgb, #10B981 12%, var(--sup-fuerte)); }
  .orden.flujo .caja.f-io { transform: skewX(-14deg); border-color: #0EA5E9; background: color-mix(in srgb, #0EA5E9 10%, var(--sup-fuerte)); }
  .orden.flujo .caja.f-io .tx { display: inline-block; transform: skewX(14deg); }
  .orden.flujo .caja.f-dec { border: 0; background: transparent; isolation: isolate; padding: 18px 40px; }
  .orden.flujo .caja.f-dec::before { content: ''; position: absolute; inset: 0; z-index: -1; clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); background: color-mix(in srgb, #F59E0B 28%, var(--sup-fuerte)); }
  .leyenda-flujo { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--suave); margin: 0 0 10px; }
  .leyenda-flujo i { display: inline-block; width: 18px; height: 10px; margin-right: 4px; vertical-align: middle; border: 2px solid var(--acento); }
  .rel-f { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; margin: 8px 0; }
  .rel-f .izq { padding: 11px 14px; border-radius: 14px; background: var(--sup-fuerte); border: 1px solid var(--linea); font-weight: 600; }
  .rel-f .flecha { color: var(--acento); font-weight: 800; }
  @media (max-width: 600px) { .rel-f { grid-template-columns: 1fr; gap: 4px; } .rel-f .flecha { display: none; } }
  .clas { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
  .cubo { padding: 10px; border-radius: 16px; border: 2px dashed var(--linea); background: var(--sup2); cursor: pointer; }
  .cubo.pool { grid-column: 1 / -1; border-style: solid; }
  .cubo > b { display: block; font-size: 14px; margin: 0 4px 4px; }
  .cub { min-height: 48px; display: flex; flex-wrap: wrap; align-content: flex-start; }
  .chip-it { display: inline-flex; padding: 9px 13px; border-radius: 999px; background: var(--sup-solida); border: 1px solid var(--linea); margin: 4px; cursor: grab; touch-action: none; font-weight: 600; font-size: 14.5px; }
  .chip-it.sel { border-color: var(--acento); box-shadow: 0 0 0 2px var(--acento); }
  .completar { line-height: 2.5; font-size: 17px; }
  .completar.codigo { font-family: ui-monospace, Consolas, monospace; white-space: pre-wrap; font-size: 14.5px; line-height: 2.2; padding: 14px; border-radius: 14px; background: var(--sup2); }
  .hueco { border: 0; border-bottom: 2px solid var(--acento); background: color-mix(in srgb, var(--acento) 8%, transparent); width: 9em; padding: 3px 8px; font: inherit; color: var(--texto); border-radius: 6px 6px 0 0; outline: none; }
  .hueco:focus { background: color-mix(in srgb, var(--acento) 16%, transparent); }
  input.numer { max-width: 240px; }
  select.hueco { width: auto; min-width: 7em; cursor: pointer; }
  .banco-pal { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; border-radius: 14px; background: var(--sup2); margin-bottom: 10px; }
  .banco-pal .pal { padding: 7px 13px; border-radius: 999px; background: var(--sup-solida); border: 1px solid var(--linea); font-weight: 600; font-size: 14.5px; }
  .banco-pal .pal.usada { opacity: .4; text-decoration: line-through; }
  .just { min-height: 90px; margin-top: 4px; }
  .rel2 { position: relative; display: grid; grid-template-columns: 1fr minmax(36px, 16%) 1fr; }
  .rel2 .rcol { display: flex; flex-direction: column; justify-content: space-around; gap: 10px; }
  .rel2 .rcol:first-of-type { grid-column: 1; } .rel2 .rcol:last-of-type { grid-column: 3; }
  .rlin { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .rbtn { position: relative; text-align: left; padding: 11px 14px; min-height: 46px; border-radius: 14px; background: var(--sup-fuerte); border: 2px solid var(--linea); font: inherit; font-weight: 600; font-size: 15px; color: var(--texto); cursor: pointer; }
  .rbtn.par { border-color: var(--c); }
  .rbtn.sel { border-color: var(--acento); box-shadow: 0 0 0 3px color-mix(in srgb, var(--acento) 30%, transparent); }
  .rbtn .rn { position: absolute; top: -9px; right: -9px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--c); color: #fff; font-size: 12px; display: none; place-items: center; }
  .rbtn.par .rn { display: grid; }
  .rev .r span { white-space: pre-line; }
</style>
</head>
<body>
<div class="fondo"><i></i><i></i><i></i><i></i></div>
<div class="tema tema-fijo"></div>

<section id="vCodigo" class="centro">
  <div class="portada vidrio">
    <div class="heroe">
      <div class="logo" id="logo1"></div>
      <h1>¡Hola! 👋</h1>
      <p>Escribe el código que te dio tu profesor para empezar.</p>
    </div>
    <div class="cuerpo">
      <label class="campo"><span>Código</span><input id="codigo" class="entrada codigo-in" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="E-XXXXX"></label>
      <div class="error" id="errCodigo"></div>
      <button class="btn primario ancho" id="btnCodigo">Continuar <span id="icoSig"></span></button>
      <button class="btn claro ancho" id="btnDemo" type="button" style="margin-top:10px">✨ Probar la demo: todos los tipos de pregunta</button>
      <div class="pie-portada suave"><span><span data-marca>Examen Seguro</span> · <span data-version></span></span><a href="docente.html">Soy docente</a></div>
    </div>
  </div>
</section>

<section id="vDatos" class="centro oculto">
  <div class="portada vidrio">
    <div class="heroe">
      <div class="logo" id="logo2"></div>
      <h1 id="dTitulo"></h1>
      <p id="dSub"></p>
      <div class="chips" id="dChips"></div>
    </div>
    <div class="cuerpo">
      <label class="campo"><span>Tu nombre</span><select id="nombre" class="entrada"></select><input id="nombreLibre" class="entrada oculto" placeholder="Nombre y apellido"></label>
      <label class="campo oculto" id="campoPin"><span>Tu PIN (4 números que te dio tu profesor)</span><input id="pin" class="entrada" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="••••"></label>
      <div class="reglas" id="dReglas"></div>
      <div class="error" id="errDatos"></div>
      <button class="btn primario ancho" id="btnEmpezar">Empezar</button>
      <div class="pie-portada"><button class="btn fantasma mini" id="btnVolver"><span id="icoAtras"></span> Cambiar código</button><span class="suave" id="dDocente"></span></div>
    </div>
  </div>
</section>

<section id="vExamen" class="oculto">
  <div class="barra">
    <div class="tit"><b id="eTitulo"></b><span class="suave pequeno" id="eNombre"></span></div>
    <div class="reloj" id="eReloj"></div>
    <button class="btn claro mini" id="btnSalir" type="button"></button>
  </div>
  <div class="progreso"><i id="eAvance"></i></div>
  <div class="marca-agua oculto" id="eMarca"></div>
  <div class="zona">
    <div id="ePregs"></div>
    <aside class="navegador vidrio">
      <b>Preguntas</b>
      <div class="numeros" id="eNumeros"></div>
      <div class="leyenda"><span><i style="background:var(--acento)"></i>Respondida</span><span><i style="background:var(--amarillo)"></i>Para revisar</span></div>
      <p class="pequeno suave" id="eGuardado" style="margin:12px 0 0"></p>
    </aside>
  </div>
  <div class="entregar-fijo"><button class="btn primario" id="btnEntregar" style="min-width:240px"></button></div>
</section>

<section id="vFin" class="centro oculto">
  <div class="tarjeta" style="width:min(720px,100%)">
    <div style="text-align:center">
      <div class="chip-ico verde" id="fIco" style="width:56px;height:56px;border-radius:18px;margin:0 auto 10px"></div>
      <h1 id="fTitulo">Entregado</h1>
      <p class="suave" id="fMotivo" style="margin:4px 0 0"></p>
    </div>
    <div id="fNota"></div>
    <div id="fRev"></div>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px">
      <button class="btn primario" id="btnOtra" hidden>Intentar de nuevo (preguntas nuevas)</button>
      <button class="btn claro" id="btnInicio">Volver al inicio</button>
    </div>
  </div>
</section>

<div class="modal oculto" id="modal"><div class="tarjeta" style="text-align:center">
  <div class="chip-ico amarillo" id="mIco" style="width:52px;height:52px;border-radius:16px;margin:0 auto 10px"></div>
  <h2 id="mTit" style="justify-content:center"></h2><p class="suave" id="mTxt"></p>
  <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px"><button class="btn claro" id="mNo"></button><button class="btn primario" id="mSi"></button></div>
</div></div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var st = { ex: null, r: {}, codigo: '', nombre: '', intento: '', token: '', preguntas: [], resp: {}, marcadas: {}, limite: 0, desfase: 0,
             activo: false, terminado: false, armado: false, salidas: 0, pc: false, reloj: null, guardarT: null, ultimaSalida: 0, modal: null };
  $('logo1').innerHTML = LOGO_HTML(); $('logo2').innerHTML = LOGO_HTML(); $('icoSig').innerHTML = ICO('adelante'); $('icoAtras').innerHTML = ICO('atras');
  $('btnSalir').innerHTML = ICO('salida') + ' Salir';

  function ver(id) { ['vCodigo', 'vDatos', 'vExamen', 'vFin'].forEach(function (v) { $(v).classList.toggle('oculto', v !== id); }); document.body.classList.toggle('examen-activo', id === 'vExamen'); window.scrollTo(0, 0); }
  function reintentar(datos, n) {
    return API(datos, { keepalive: true }).catch(function (e) {
      if (n > 0 && !/no válido|entregaste/i.test(e.message)) return new Promise(function (ok) { setTimeout(ok, 1500); }).then(function () { return reintentar(datos, n - 1); });
      throw e;
    });
  }

  $('codigo').value = new URLSearchParams(location.search).get('c') || '';
  $('btnCodigo').onclick = function () {
    var c = $('codigo').value.trim(); $('errCodigo').textContent = '';
    if (!c) { $('errCodigo').textContent = 'Escribe el código.'; return; }
    $('btnCodigo').disabled = true;
    st.tipos = c.toUpperCase() === st.demoCod ? st.demoTipos : '';   /* filtro de tipos solo para la demo pedida en el enlace */
    API({ action: 'abrir', codigo: c, tipos: st.tipos }).then(function (r) {
      st.ex = r.examen; st.r = r.examen.reglas || {}; st.codigo = c; st.desfase = r.ahora - Date.now();
      var ex = r.examen, R = st.r, prac = ex.modo === 'PRACTICA';
      $('dTitulo').textContent = ex.titulo;
      $('dSub').textContent = [ex.materia, ex.curso].filter(Boolean).join(' · ');
      $('dDocente').textContent = ex.docente ? 'Prof. ' + ex.docente : '';
      $('dChips').innerHTML = [[prac ? 'libro' : 'examen', prac ? 'Práctica' : 'Examen'], ['lista', ex.preguntas + ' preguntas'], ['reloj', ex.minutos ? ex.minutos + ' min' : 'Sin límite'],
        ['intentos', R.intentos ? (R.intentos === 1 ? '1 intento' : R.intentos + ' intentos') : 'Intentos libres']].map(function (c) { return '<span>' + ICO(c[0]) + esc(c[1]) + '</span>'; }).join('');
      var sel = $('nombre'); sel.innerHTML = '<option value="">Elige tu nombre…</option>' + r.nombres.map(function (n) { return '<option>' + esc(n) + '</option>'; }).join('');
      sel.classList.toggle('oculto', !r.nombres.length); $('nombreLibre').classList.toggle('oculto', !!r.nombres.length);
      st.pidePin = !!r.pin; $('campoPin').classList.toggle('oculto', !st.pidePin); $('pin').value = '';

        var j = Number(a.dataset.j), x = arr[j], c = COLORES[j % COLORES.length], par = x !== null && x !== undefined && der[x];
        a.classList.toggle('par', !!par); a.classList.toggle('sel', !!sel && sel.lado === 'i' && sel.v === j); a.style.setProperty('--c', c); a.querySelector('.rn').textContent = j + 1;
        if (!par) return;
        var d = der[x], L = a.getBoundingClientRect(), R = d.getBoundingClientRect(), rn = d.querySelector('.rn');
        d.classList.add('par'); d.style.setProperty('--c', c); rn.textContent = rn.textContent ? rn.textContent + ',' + (j + 1) : j + 1;
        if (!L.width || !B.width) return;   // pregunta oculta (modo una por página): se dibuja al mostrarla
        var x1 = L.right - B.left, y1 = L.top + L.height / 2 - B.top, x2 = R.left - B.left, y2 = R.top + R.height / 2 - B.top;
        svg += '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + c + '" stroke-width="3" stroke-linecap="round"/><circle cx="' + x1 + '" cy="' + y1 + '" r="5" fill="' + c + '"/><circle cx="' + x2 + '" cy="' + y2 + '" r="5" fill="' + c + '"/>';
      });
      box.querySelector('.rlin').innerHTML = svg;
    });
  }
  window.addEventListener('resize', function () { clearTimeout(st.lineasT); st.lineasT = setTimeout(lineas, 120); });
  /* V o F justificada: la elección y el texto se guardan juntos */
  $('ePregs').addEventListener('change', function (e) {
    if (!st.activo || !e.target.classList.contains('vfj-r')) return;
    var i = Number(e.target.dataset.i), x = Object.assign({ v: null, j: '' }, st.resp[i]); x.v = Number(e.target.value); st.resp[i] = x;
    document.querySelectorAll('.op[data-i="' + i + '"]').forEach(function (l) { l.classList.toggle('sel', Number(l.dataset.j) === x.v); });
    cambio();
  });
  $('ePregs').addEventListener('input', function (e) {
    if (!st.activo) return;
    var el = e.target, i = Number(el.dataset.i);
    if (el.classList.contains('numer')) { var v = el.value.replace(',', '.').trim(); if (v && !isNaN(Number(v))) st.resp[i] = v; else delete st.resp[i]; cambio(); }
    if (el.classList.contains('hueco')) { var arr = [].map.call(document.querySelectorAll('.hueco[data-i="' + i + '"]'), function (x) { return x.value.trim(); });
      if (arr.some(Boolean)) st.resp[i] = arr; else delete st.resp[i]; cambio();
      document.querySelectorAll('.banco-pal[data-i="' + i + '"] .pal').forEach(function (p) { p.classList.toggle('usada', arr.indexOf(p.textContent) >= 0); }); }
    if (el.classList.contains('just')) { var x = Object.assign({ v: null, j: '' }, st.resp[i]); x.j = el.value.trim();
      if (x.v === null && !x.j) delete st.resp[i]; else st.resp[i] = x; cambio(); }
  });
  function cambio() { progreso(); clearTimeout(st.guardarT); st.guardarT = setTimeout(guardar, 1200); }
  /* Puente para tipos.js: lee y guarda la respuesta de cada pregunta (v = null la borra) */
  function TX(q) { return window.TIPOSX && window.TIPOSX[q.tipo]; }
  window.TIPOSX_CTX = { resp: function (i) { return st.resp[i]; }, pregunta: function (i) { return st.preguntas && st.preguntas[i]; }, activo: function () { return !!st.activo; },
    poner: function (i, v) { if (!st.activo) return; if (v === null || v === undefined) delete st.resp[i]; else st.resp[i] = v; cambio(); } };
  function progreso() {
    var r = Object.keys(st.resp).length, n = st.preguntas.length;
    $('eAvance').style.width = (n ? r / n * 100 : 0) + '%';
    document.querySelectorAll('#eNumeros button').forEach(function (b) { var i = b.dataset.ir; b.classList.toggle('hecha', st.resp[i] !== undefined); b.classList.toggle('marcada', !!st.marcadas[i]); });
    $('eNombre').textContent = st.nombre + ' · ' + r + ' de ' + n + ' respondidas';
  }
  function guardar() {
    if (!st.activo) return;
    $('eGuardado').textContent = 'Guardando…';
    API({ action: 'guardar', intento: st.intento, token: st.token, respuestas: st.resp, pos: st.pag || 0 }).then(function (r) {
      $('eGuardado').innerHTML = ICO('check') + ' Respuestas guardadas';
      if (r.estado !== 'EN_CURSO') terminar('Se acabó el tiempo');
      else if (r.limite && r.limite > st.limite) { st.limite = r.limite; AVISO('Tu profesor te dio más tiempo'); }
    }).catch(function () { $('eGuardado').textContent = 'Sin conexión: se guardará al entregar.'; });
  }

  function reloj() {
    clearInterval(st.reloj);
    if (!st.limite) { $('eReloj').innerHTML = ICO('reloj') + ' Sin límite'; return; }
    var tic = function () {
      var falta = st.limite - (Date.now() + st.desfase);
      if (falta <= 0) { $('eReloj').innerHTML = ICO('reloj') + ' 00:00'; terminar('Se acabó el tiempo'); return; }
      var s = Math.ceil(falta / 1000), m = Math.floor(s / 60);
      $('eReloj').innerHTML = ICO('reloj') + ' ' + (m < 10 ? '0' : '') + m + ':' + ('0' + (s % 60)).slice(-2);
      $('eReloj').classList.toggle('poco', falta < 5 * 60000);
    };
    tic(); st.reloj = setInterval(tic, 500);
  }

  function preguntar(tipo, ico, tit, txt, si, no) {
    st.modal = tipo; $('mIco').innerHTML = ICO(ico); $('mTit').textContent = tit; $('mTxt').textContent = txt;
    $('mSi').textContent = si; $('mNo').textContent = no || 'Seguir respondiendo'; $('mNo').classList.toggle('oculto', no === false);
    $('modal').classList.remove('oculto');
  }
  $('mNo').onclick = function () { $('modal').classList.add('oculto'); };
  $('mSi').onclick = function () {
    $('modal').classList.add('oculto');
    if (st.modal === 'salir') terminar('Salió con el botón Salir');
    else if (st.modal === 'entregar') terminar('Entregado por el estudiante');
    else if (st.modal === 'siguiente') irPag(st.pag + 1);
    else if (st.modal === 'volver' && st.pc) pedirPantalla().catch(function () { terminar('No volvió a la pantalla completa'); });
  };
  $('btnSalir').onclick = function () {
    preguntar('salir', 'salida', '¿Salir?', 'Si sales ahora, se entrega con lo que tengas respondido (' + Object.keys(st.resp).length + ' de ' + st.preguntas.length + ').' +
      (st.r.intentos === 1 ? ' No podrás volver a entrar.' : ''), 'Sí, salir y entregar');
  };
  $('btnEntregar').onclick = function () {
    var faltan = st.preguntas.length - Object.keys(st.resp).length, marc = Object.keys(st.marcadas).filter(function (k) { return st.marcadas[k]; }).length;
    preguntar('entregar', 'check', '¿Entregar ahora?', (faltan ? 'Te faltan ' + faltan + ' pregunta(s). ' : 'Respondiste todo. ') + (marc ? 'Tienes ' + marc + ' marcada(s) para revisar. ' : '') + 'Después no podrás cambiar nada.', 'Sí, entregar');
  };

  function terminar(motivo) {
    if (st.terminado || !st.activo) return;
    st.terminado = true; st.activo = false; st.armado = false;
    clearInterval(st.reloj); clearTimeout(st.guardarT); $('modal').classList.add('oculto');
    $('fTitulo').textContent = st.ex.modo === 'PRACTICA' ? 'Práctica terminada' : 'Examen entregado';
    $('fMotivo').textContent = motivo + '. Entregando…'; $('fNota').innerHTML = ''; $('fRev').innerHTML = ''; $('btnOtra').hidden = true;
    $('fIco').innerHTML = ICO('check'); ver('vFin'); salirPantalla();
    reintentar({ action: 'entregar', intento: st.intento, token: st.token, respuestas: st.resp, motivo: motivo, salidas: st.salidas }, 3).then(function (r) {
      $('fMotivo').textContent = (r.motivo || motivo) + ' · ' + DURACION(r.duracion) + '. Tus respuestas quedaron guardadas.';
      if (r.nota !== undefined) {
        var c = r.nota >= 70 ? 'var(--verde)' : r.nota >= 50 ? 'var(--amarillo)' : 'var(--rojo)';
        $('fNota').innerHTML = '<div class="anillo" style="--p:' + r.nota + ';--c:' + c + '"><div><span><b>' + r.nota + '</b><small>de 100</small></span></div></div>' +
          '<p style="text-align:center;margin:0 0 6px"><b>' + (r.pendiente ? '📝 Nota provisional' : r.aprobado ? '🎉 ¡Muy bien!' : '💪 Sigue practicando') + '</b> · ' + r.correctas + ' de ' + r.total + ' correctas</p>' +
          (r.pendiente ? '<p class="suave pequeno" style="text-align:center;margin:0">Tu profesor corregirá ' + r.pendiente + ' respuesta(s) escrita(s) y tu nota puede cambiar.</p>' : '');
      } else $('fNota').innerHTML = '<p class="suave" style="text-align:center">Tu profesor te dará la nota.</p>';
      if (r.revision) $('fRev').innerHTML = '<h3 style="margin-top:18px">' + ICO('lista') + ' Revisión</h3>' + r.revision.map(function (q) {
        return '<div class="rev' + (q.bien || q.pendiente ? '' : ' mal') + '"><b>' + q.n + '. ' + esc(q.enunciado) + '</b>' +
          (q.pendiente ? '<div class="r">' + ICO('editar') + '<span>Tu respuesta: ' + esc(q.tu) + ' · la corrige tu profesor</span></div>' : q.bien ? '<div class="r" style="color:var(--verde)">' + ICO('check') + '<span>' + esc(q.tu) + '</span></div>'
            : (q.obtenidos > 0 ? '<div class="r" style="color:var(--amarillo)">' + ICO('estrella') + '<span>Parcial: ' + q.obtenidos + ' de ' + q.puntos + ' pt</span></div>' : '') + '<div class="r" style="color:var(--rojo)">' + ICO('x') + '<span>Tu respuesta: ' + esc(q.tu || '(sin responder)') + '</span></div><div class="r" style="color:var(--verde)">' + ICO('check') + '<span>Correcta: ' + esc(q.correcta) + '</span></div>') +
          (q.explicacion ? '<div class="r suave">' + ICO('libro') + '<span>' + esc(q.explicacion) + '</span></div>' : '') + '</div>';
      }).join('');
      $('btnOtra').hidden = !r.otroIntento;
    }).catch(function (e) { $('fIco').innerHTML = ICO('alerta'); $('fMotivo').textContent = motivo + '. No se pudo confirmar la entrega (' + e.message + '). Tus respuestas se guardaron mientras contestabas; avisa a tu profesor.'; });
  }
  $('btnOtra').onclick = function () { ver('vDatos'); $('btnEmpezar').click(); };

  /* Vigilancia según las reglas del examen */
  function salida(motivo) {
    if (!st.activo || !st.armado) return;
    var ahora = Date.now(); if (ahora - st.ultimaSalida < 1500) return;   // blur y visibilidad llegan juntos: cuenta una sola salida
    st.ultimaSalida = ahora;
    var R = st.r;
    if (R.salirEntrega && st.salidas >= R.toleranciaSalidas) { st.salidas++; terminar(motivo); return; }
    st.salidas++;
    API({ action: 'evento', intento: st.intento, token: st.token, evento: motivo, respuestas: st.resp }).catch(function () {});
    var fuera = st.pc && !enPantalla();
    if (!R.salirEntrega) {
      AVISO('Salida registrada: tu profesor lo verá.', 'error');
      if (fuera) preguntar('volver', 'pantalla', 'Vuelve a la pantalla completa', 'Tu profesor pidió hacer el examen en pantalla completa.', 'Volver a pantalla completa', false);
      return;
    }
    var quedan = R.toleranciaSalidas - st.salidas;
    preguntar(fuera ? 'volver' : 'aviso', 'alerta', 'Advertencia ' + st.salidas + ' de ' + R.toleranciaSalidas,
      motivo + '. ' + (quedan > 0 ? 'Te quedan ' + quedan + ' aviso(s).' : 'Si vuelves a salir, se entrega solo.'), fuera ? 'Volver a pantalla completa' : 'Entendido', false);
  }
  document.addEventListener('fullscreenchange', function () { if (st.pc && !enPantalla()) salida('Salió de la pantalla completa'); });
  document.addEventListener('webkitfullscreenchange', function () { if (st.pc && !enPantalla()) salida('Salió de la pantalla completa'); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) salida('Cambió de pestaña o minimizó'); });
  // Al tocar un video de YouTube o Drive el foco pasa a ese recuadro: no es salida. hasFocus() sigue en true mientras el foco esté dentro de la página.
  function revisarFoco() {
    if (document.hasFocus()) { st.fueraFoco = false; st.tuvoFoco = true; return; }
    // solo cuenta si estuvo dentro y luego salió
    if (!st.fueraFoco && st.tuvoFoco && st.activo && st.armado) { st.fueraFoco = true; salida('Salió de la ventana'); }
  }
  window.addEventListener('blur', function () { setTimeout(revisarFoco, 60); });
  setInterval(revisarFoco, 1000);
  window.addEventListener('pagehide', function () {
    if (!st.activo || st.terminado || !st.r.salirEntrega) return;
    st.terminado = true;
    var datos = JSON.stringify({ action: 'entregar', intento: st.intento, token: st.token, respuestas: st.resp, motivo: 'Cerró o recargó la página', salidas: st.salidas + 1 });
    if (!(navigator.sendBeacon && navigator.sendBeacon(window.EXAMEN_API, new Blob([datos], { type: 'text/plain' })))) fetch(window.EXAMEN_API, { method: 'POST', body: datos, keepalive: true });
  });
  window.addEventListener('beforeunload', function (e) { if (st.activo) { e.preventDefault(); e.returnValue = ''; } });
  ['contextmenu', 'copy', 'cut', 'paste', 'dragstart', 'selectstart'].forEach(function (ev) {
    document.addEventListener(ev, function (e) {
      if (!st.activo || !st.r.bloquearCopiar) return;
      if (ev === 'selectstart' && e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      e.preventDefault(); if (e.clipboardData) e.clipboardData.setData('text/plain', 'Copiar está deshabilitado en ' + MARCA + '.');
    });
  });
  document.addEventListener('keydown', function (e) {
    if (!st.activo || !st.r.bloquearCopiar) return;
    var k = (e.key || '').toLowerCase();
    if (k === 'f12' || k === 'printscreen' || k === 'f5' || ((e.ctrlKey || e.metaKey) && 'acvxpsufrnt'.indexOf(k) >= 0)) { e.preventDefault(); e.stopPropagation(); }
  }, true);
})();
</script>
